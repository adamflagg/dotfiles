# Mouse wheel scrolls back through output; click to select panes
set -g mouse on
# Keep plenty of scrollback (default is 2000 lines)
set -g history-limit 100000
# Proper colours for Claude Code: tmux-256color where this machine's terminfo
# has it (Linux, macOS 27+), else xterm-256color (Unraid ships nothing else).
# Naming an entry the machine lacks breaks less, clear and friends.
if-shell 'infocmp tmux-256color' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal xterm-256color'
set -ag terminal-overrides ",xterm-256color:RGB"
# Esc reaches Claude Code immediately instead of after a 500ms pause
set -sg escape-time 10
# Copying in tmux also copies to your local clipboard (OSC 52), where the terminal allows it
set -g set-clipboard on
# Readable status bar showing the session name
set -g status-left "[#S] "
